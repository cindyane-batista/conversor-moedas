name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Executar build do projeto
        run: npm run build

      - name: Executar testes automatizados
        run: npm test

  deploy:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código
        uses: actions/checkout@v4

      - name: Deploy no Render (Webhook)
        run: |
          # Aqui entra o comando de deploy (vamos configurar a URL do Render em breve)
          echo "Deploy realizado com sucesso!"