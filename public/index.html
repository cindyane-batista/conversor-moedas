<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; color: #333; }
        .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { font-size: 22px; margin-bottom: 20px; text-align: center; color: #1a73e8; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; transition: border 0.2s; }
        input:focus, select:focus { border-color: #1a73e8; }
        button { width: 100%; background: #1a73e8; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background: #1557b0; }
        .result { margin-top: 20px; padding: 15px; background: #e8f0fe; border-radius: 6px; text-align: center; font-size: 18px; font-weight: bold; color: #1a73e8; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Conversor de Moedas</h1>
        
        <div class="input-group">
            <label for="valor">Valor:</label>
            <input type="number" id="valor" placeholder="Ex: 100" value="100">
        </div>

        <div class="input-group">
            <label for="de">Moeda de Origem:</label>
            <select id="de">
                <option value="USD">USD (Dólar)</option>
                <option value="BRL">BRL (Real)</option>
                <option value="EUR">EUR (Euro)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="para">Moeda de Destino:</label>
            <select id="para">
                <option value="BRL" selected>BRL (Real)</option>
                <option value="USD">USD (Dólar)</option>
                <option value="EUR">EUR (Euro)</option>
            </select>
        </div>

        <button onclick="converterMoeda()">Converter</button>

        <div id="resultadoBox" class="result"></div>
    </div>

    <script>
        async function converterMoeda() {
            const valor = document.getElementById('valor').value;
            const de = document.getElementById('de').value;
            const para = document.getElementById('para').value;
            const box = document.getElementById('resultadoBox');

            if (!valor) {
                alert('Por favor, digite um valor.');
                return;
            }

            try {
                const response = await fetch(`/converter?valor=${valor}&de=${de}&para=${para}`);
                const data = await response.json();

                if (data.erro) {
                    box.style.display = 'block';
                    box.innerText = data.erro;
                } else {
                    box.style.display = 'block';
                    box.innerText = `${valor} ${de} = ${data.resultado} ${para}`;
                }
            } catch (error) {
                alert('Erro ao conectar com a API.');
            }
        }
    </script>
</body>
</html>
